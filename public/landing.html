  <meta charset="UTF-8" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11.11.13/dist/framer-motion.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #FFFFFF;
      color: #1a1a2e;
      overflow-x: hidden;
      line-height: 1.6;
    }
    :root {
      --bg: #FFFFFF;
      --bg-subtle: #F9FAFB;
      --bg-card: #FFFFFF;
      --text: #1a1a2e;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.12);
      --violet: #7c3aed;
      --violet-light: #ede9fe;
      --orange: #ea580c;
      --orange-light: #fff7ed;
      --emerald: #059669;
      --emerald-light: #ecfdf5;
      --sky: #0284c7;
      --sky-light: #f0f9ff;
      --rose: #e11d48;
      --rose-light: #fff1f2;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-subtle); }
    ::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 3px; }

    /* ─── DYNAMIC WHITE BACKGROUND — visibly moving  ─── */
    .page-bg {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    /* moving mesh that actually drifts across the screen */
    .bg-mesh{
      position:absolute;
      inset: -40%;
      background:
        radial-gradient(ellipse 780px 520px at 22% 18%, rgba(124,58,237,0.16), transparent 58%),
        radial-gradient(ellipse 680px 560px at 82% 22%, rgba(234,88,12,0.13), transparent 58%),
        radial-gradient(ellipse 720px 520px at 18% 84%, rgba(5,150,105,0.11), transparent 58%),
        radial-gradient(ellipse 560px 560px at 78% 88%, rgba(2,132,199,0.10), transparent 58%);
      filter: blur(22px);
      animation: meshPan 26s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes meshPan { 0%{ transform: translate3d(0,0,0) scale(1)} 50%{ transform: translate3d(3%, -2%,0) scale(1.04)} 100%{ transform: translate3d(-2.5%, 2.5%,0) scale(1.02)} }
    /* shimmer band that sweeps */}
    .bg-shimmer{
      position:absolute;
      inset: -20% -10%;
      background: linear-gradient(108deg, transparent 42%, rgba(124,58,237,0.085) 50%, transparent 58%);
      transform: translateX(-55%) skewX(-12deg);
      animation: shimmerSweep 9s ease-in-out infinite;
    }
    @keyframes shimmerSweep { 0%{ transform: translateX(-55%) skewX(-12deg)} 50%{ transform: translateX(55%) skewX(-12deg)} 100%{ transform: translateX(-55%) skewX(-12deg)} }
    /* flowing aurora ribbons */
    .bg-aurora{
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, transparent 0%, rgba(124,58,237,0.045) 35%, transparent 70%),
        linear-gradient(180deg, transparent 10%, rgba(234,88,12,0.035) 45%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 92% 70% at 50% 50%, #000 55%, transparent 82%);
              mask-image: radial-gradient(ellipse 92% 70% at 50% 50%, #000 55%, transparent 82%);
      opacity: 0.9;
      animation: auroraShift 14s ease-in-out infinite alternate;
    }
    @keyframes auroraShift { 0%{ transform: translateY(0) scaleY(1)} 100%{ transform: translateY(12px) scaleY(1.06)} }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(17,24,39,0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17,24,39,0.055) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 96% 78% at 50% 0%, #000 42%, transparent 76%);
              mask-image: radial-gradient(ellipse 96% 78% at 50% 0%, #000 42%, transparent 76%);
      animation: gridPan 40s linear infinite;
    }
    @keyframes gridPan { 0%{ background-position: 0 0} 100%{ background-position: 64px 64px} }
    .bg-grid::after{
      content:'';
      position:absolute; inset:0;
      background-image:
        linear-gradient(to right, rgba(17,24,39,0.022) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17,24,39,0.022) 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 1;
    }
    .bg-dot-accent{
      position:absolute; inset:0;
      background-image: radial-gradient(circle, rgba(124,58,237,0.14) 1.35px, transparent 1.35px);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(ellipse 48% 42% at 72% 16%, #000 0%, transparent 68%);
              mask-image: radial-gradient(ellipse 48% 42% at 72% 16%, #000 0%, transparent 68%);
      opacity: 0.62;
      animation: dotDrift 22s ease-in-out infinite alternate;
    }
    @keyframes dotDrift { 0%{ transform: translate(0,0)} 100%{ transform: translate(-10px, 8px)} }
    .background{
      position:absolute; inset:0;
      background-image: radial-gradient(circle, rgba(17,24,39,0.09) 1.1px, transparent 1.1px);
      background-size: 20px 20px;
      opacity: 0.42;
      will-change: transform; transition: transform 0.55s cubic-bezier(0.16,1,0.3,1);
      -webkit-mask-image: radial-gradient(ellipse 88% 70% at 50% 50%, #000 58%, transparent 82%);
              mask-image: radial-gradient(ellipse 88% 70% at 50% 50%, #000 58%, transparent 82%);
    }
    .bg-canvas{
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0.34;
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    .bg-orb{
      position:absolute;
      border-radius: 50%;
      filter: blur(30px);
      will-change: transform;
      mix-blend-mode: multiply;
      transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    .orb-1{
      width: 520px; height: 360px;
      left: 48%; top: -100px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(124,58,237,0.14) 0%, rgba(124,58,237,0.06) 36%, transparent 72%);
      animation: orbDrift1 11s ease-in-out infinite alternate;
    }
    .orb-2{
      width: 440px; height: 420px;
      right: -80px; top: 22%;
      background: radial-gradient(circle at 50% 50%, rgba(234,88,12,0.10) 0%, rgba(234,88,12,0.045) 42%, transparent 70%);
      animation: orbDrift2 13s ease-in-out infinite alternate;
    }
    .orb-3{
      width: 460px; height: 380px;
      left: -90px; top: 58%;
      background: radial-gradient(circle at 50% 50%, rgba(5,150,105,0.09) 0%, rgba(5,150,105,0.04) 45%, transparent 70%);
      animation: orbDrift3 15s ease-in-out infinite alternate;
    }
    .orb-4{
      width: 400px; height: 380px;
      left: 58%; bottom: -100px;
      background: radial-gradient(circle at 50% 50%, rgba(2,132,199,0.08) 0%, transparent 70%);
      animation: orbDrift1 17s ease-in-out infinite alternate-reverse;
    }
    @keyframes orbDrift1 { 0%{ transform: translateX(-50%) translateY(0) scale(1)} 100%{ transform: translateX(-46%) translateY(22px) scale(1.06)} }
    @keyframes orbDrift2 { 0%{ transform: translate(0,0) scale(1)} 100%{ transform: translate(-26px, 28px) scale(1.08)} }
    @keyframes orbDrift3 { 0%{ transform: translate(0,0) scale(1)} 100%{ transform: translate(28px, -20px) scale(1.07)} }

    .bg-halo{
      position:absolute;
      inset:0;
      background:
        radial-gradient(ellipse 110% 70% at 50% -16%, rgba(124,58,237,0.085), transparent 62%),
        radial-gradient(ellipse 90% 55% at 92% 18%, rgba(234,88,12,0.07), transparent 55%),
        radial-gradient(ellipse 70% 45% at 8% 82%, rgba(5,150,105,0.055), transparent 58%);
      animation: haloPulse 10s ease-in-out infinite alternate;
    }
    @keyframes haloPulse { 0%{ opacity:0.95} 100%{ opacity:1; filter: brightness(1.06)} }
    .bg-noise{
      position:absolute; inset:0;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    .bg-vignette{
      position:absolute; inset:0;
      background: radial-gradient(ellipse 120% 90% at 50% 50%, transparent 58%, rgba(17,24,39,0.032) 100%);
    }
    .bg-beam{
      position:absolute;
      width: 1.5px; height: 140%;
      top: -20%;
      background: linear-gradient(180deg, transparent, rgba(124,58,237,0.18), transparent);
      opacity: 0.0;
      animation: beamSweep 9s ease-in-out infinite;
    }
    .bg-beam.b1{ left: 26%; transform: rotate(14deg); animation-delay: 0s; }
    .bg-beam.b2{ left: 74%; transform: rotate(-12deg); animation-delay: 3.5s; }
    @keyframes beamSweep { 0%, 90%, 100%{ opacity:0; transform: translateX(0) rotate(14deg)} 6%{ opacity:0.7} 16%{ opacity:0} }

    .brand-logo{
      width: 42px; height: 42px;
      object-fit: contain;
      display: block;
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
      filter: drop-shadow(0 2px 8px rgba(17,24,39,0.08));
    }
    .brand-logo--footer{ width: 38px; height: 38px; }
    .hero-logo-wrap{
      width: 110px; height: 110px;
      margin: 0 auto 18px;
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      filter: drop-shadow(0 12px 28px rgba(17,24,39,0.10)) drop-shadow(0 2px 8px rgba(17,24,39,0.06));
    }
    .hero-logo-wrap::after{ display: none; }
    .hero-logo{ width:100%; height:100%; object-fit: contain; border-radius: 0; background: transparent; }

    /* Section backgrounds — translucent glass so moving bg is visible */
    .section-white { background: rgba(255,255,255,0.62); backdrop-filter: blur(8px) saturate(1.05); -webkit-backdrop-filter: blur(8px) saturate(1.05); }
    .section-subtle { background: rgba(249,250,251,0.52); backdrop-filter: blur(8px) saturate(1.05); -webkit-backdrop-filter: blur(8px) saturate(1.05); }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      border-color: var(--violet);
      box-shadow: 0 8px 30px rgba(124,58,237,0.08), 0 2px 8px rgba(0,0,0,0.04);
      transform: translateY(-2px);
    }

    /* Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .pill-violet { background: var(--violet-light); color: var(--violet); border-color: rgba(124,58,237,0.2); }
    .pill-orange { background: var(--orange-light); color: var(--orange); border-color: rgba(234,88,12,0.2); }
    .pill-emerald { background: var(--emerald-light); color: var(--emerald); border-color: rgba(5,150,105,0.2); }
    .pill-sky { background: var(--sky-light); color: var(--sky); border-color: rgba(2,132,199,0.2); }
    .pill-rose { background: var(--rose-light); color: var(--rose); border-color: rgba(225,29,72,0.2); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--violet);
      color: #fff;
      box-shadow: 0 2px 8px rgba(124,58,237,0.25);
    }
    .btn-primary:hover {
      background: #6d28d9;
      box-shadow: 0 4px 16px rgba(124,58,237,0.35);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: var(--violet);
    }
    .btn-orange {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 2px 8px rgba(234,88,12,0.25);
    }
    .btn-orange:hover {
      background: #c2410c;
      box-shadow: 0 4px 16px rgba(234,88,12,0.35);
      transform: translateY(-1px);
    }

    /* Modal — portaled to body; fixed to viewport (not section) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overscroll-behavior: contain;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 900px;
      width: 100%;
      max-height: min(85vh, 85dvh);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }
    @media (max-width: 768px) {
      .modal-overlay {
        align-items: flex-end;
        justify-content: stretch;
        padding: 0;
        padding-top: env(safe-area-inset-top, 0px);
      }
      .modal-content {
        max-width: 100%;
        width: 100%;
        max-height: min(92dvh, 92vh);
        border-radius: 20px 20px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
      }
      .modal-modes,
      .modal-views,
      .modal-caps,
      .modal-details {
        grid-template-columns: 1fr !important;
      }
      .modal-flow {
        flex-direction: column !important;
        align-items: stretch !important;
      }
      .modal-flow > span { display: none !important; }
    }

    /* Chat interface - Light theme */
    .chat-container {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .chat-header {
      background: linear-gradient(135deg, var(--violet) 0%, #8b5cf6 100%);
      padding: 20px 24px;
      color: #fff;
    }
    .chat-messages {
      padding: 24px;
      min-height: 380px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-subtle);
    }
    .chat-input-area {
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      background: var(--bg-card);
    }

    /* Message bubbles - Light */
    .msg-nova {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px 16px 16px 4px;
      padding: 16px 20px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .msg-user {
      background: var(--violet);
      color: #fff;
      border-radius: 16px 16px 4px 16px;
      padding: 16px 20px;
      max-width: 85%;
      align-self: flex-end;
      font-size: 14px;
      line-height: 1.7;
    }

    /* Revision mode — highlighted to drive clicks */
    .revision-active {
      background: linear-gradient(135deg, var(--emerald) 0%, #10b981 100%);
    }
    .revision-highlight{
      position: relative;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.42), 0 6px 18px rgba(5,150,105,0.28);
      animation: revisionPulse 1.6s ease-in-out infinite;
    }
    .revision-highlight::after{
      content:'● TRY'; position:absolute; top:-8px; right:-10px;
      font-size:8px; font-weight:800; letter-spacing:0.06em;
      background:#f59e0b; color:#fff; padding:2px 6px; border-radius:100px;
      box-shadow:0 2px 8px rgba(245,158,11,0.35);
    }
    @keyframes revisionPulse { 0%,100%{ transform: scale(1); box-shadow:0 0 0 2px rgba(255,255,255,0.42), 0 6px 18px rgba(5,150,105,0.18)} 50%{ transform: scale(1.04); box-shadow:0 0 0 3px rgba(255,255,255,0.55), 0 8px 22px rgba(5,150,105,0.30)} }
    .voice-indicator {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--emerald);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
    }
    .voice-indicator::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--emerald);
      animation: voice-pulse 1.5s ease-out infinite;
    }
    @keyframes voice-pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* Tab system */
    .tab-btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); background: var(--bg-subtle); }
    .tab-btn.active {
      background: var(--violet-light);
      border-color: rgba(124,58,237,0.2);
      color: var(--violet);
    }

    /* Feature showcase scroll — seamless infinite, no gap */
    @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes scroll-down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
    .scroll-col-up { animation: scroll-up 40s linear infinite; will-change: transform; }
    .scroll-col-down { animation: scroll-down 40s linear infinite; will-change: transform; }

    /* Section */
    .section { position: relative; padding: 100px 0; overflow: hidden; }

    /* Role panel */
    .role-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .role-panel-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--violet) 0%, var(--orange) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes pulseDot { 0%,100%{ opacity:1; transform: scale(1)} 50%{ opacity:0.55; transform: scale(0.85)} }


    /* ─── Dynamic motion system ─── */
    html { scroll-behavior: smooth; }
    .page-curtain {
      position: fixed; inset: 0; z-index: 20000;
      background: #0b0d17;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .page-curtain-logo {
      width: 88px; height: 88px; object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(124,58,237,0.45));
    }
    .btn { position: relative; overflow: hidden; }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }
    .btn:hover::after { transform: translateX(120%); }
    .reveal-up { will-change: transform, opacity; }
    .glow-border {
      position: relative;
    }
    .glow-border::before {
      content: '';
      position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
      background: linear-gradient(120deg, #7c3aed, #ea580c, #059669, #7c3aed);
      background-size: 300% 300%;
      animation: glowShift 6s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none; opacity: 0.85;
    }
    @keyframes glowShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .float-chip {
      animation: floatY 4.5s ease-in-out infinite;
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .learning-loop-step {

    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence, useScroll, useTransform, useInView } = Motion;


    function PageIntro({ onDone }) {
      return (
        <motion.div

    function Reveal({ children, delay = 0, y = 36, x = 0, once = 1, style, className }) {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, margin: '-80px' });
      return (
        <motion.div
          ref={ref}
          className={className}
          style={style}
          initial={{ opacity: 0, y, x, scale }}
          animate={inView ? { opacity: 1, y: 0, x: 0, scale: 1 } : {}}
          transition={{ duration: 0.7, delay, ease: [0.16, 1, 0.3, 1] }}
        >
          {children}
        </motion.div>
      );
    }

    function SlideIn({ children, from = 'left', delay = 0, style, className }) {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, margin: '-80px' });
      const x = from === 'left' ? -48 : from === 'right' ? 48 : 0;
      const y = from === 'up' ? 40 : from === 'down' ? -24 : 0;
      return (
        <motion.div
          ref={ref}
          className={className}
          style={style}
          initial={{ opacity: 0, x, y }}
          animate={inView ? { opacity: 1, x: 0, y: 0 } : {}}
          transition={{ duration: 0.75, delay, ease: [0.16, 1, 0.3, 1] }}
        >
          {children}

    }

    function ScrollProgress(){

    function MouseGlow(){
      const [pos, setPos] = useState({ x: -400, y: -400 });
      useEffect(() => {
        const handle = (e) => {
          const x = e.touches ? e.touches[0].clientX : e.clientX;
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          setPos({ x, y });
          const nx = (x / window.innerWidth - 0.5);
          const ny = (y / window.innerHeight - 0.5);
          const dot = document.querySelector('.bg-dot-accent');
          if(dot) dot.style.transform = `translate(${nx*22}px, ${ny*16}px)`;
          const bg = document.querySelector('.background');
          if(bg) bg.style.transform = `translate(${nx*18}px, ${ny*14}px)`;
          const logo = document.querySelector('.hero-logo');
          if(logo) logo.style.transform = `translate(${nx*10}px, ${ny*8}px)`;
          const grid = document.querySelector('.bg-grid');
          if(grid) grid.style.transform = `translate(${nx*8}px, ${ny*6}px)`;
          const canvas = document.querySelector('.bg-canvas');
          if(canvas) canvas.style.transform = `translate(${nx*10}px, ${ny*7}px)`;
          document.querySelectorAll('.hero-orbit').forEach((el,i) => {
            const m = [1.2, -1.0, 0.9][i] || 1;
            el.style.transform = `translate(${nx*14*m}px, ${ny*10*m}px)`;
          });
          document.querySelectorAll('.bg-orb').forEach((el,i) => {
            const m = [0.6, 0.5, 0.7, 0.45][i] || 0.5;
            const base = el.classList.contains('orb-1') ? 'translateX(-50%) ' : '';
            el.style.transform = base + `translate(${nx*14*m}px, ${ny*12*m}px)`;
          });
        };
        window.addEventListener('mousemove', handle);
        window.addEventListener('touchmove', handle, { passive: true });
        window.addEventListener('touchstart', handle, { passive: true });
        return () => {
          window.removeEventListener('mousemove', handle);
          window.removeEventListener('touchmove', handle);
          window.removeEventListener('touchstart', handle);
        };
      }, []);
      return <div className="mouse-glow" style={{ left: pos.x, top: pos.y }} />;
    }
    function BgCanvasFX(){
      useEffect(() => {
        const c = document.querySelector('.bg-canvas');
        if(!c) return;
        const ctx = c.getContext('2d');
        let w,h,dpr, raf;
        let mx=0, my=0;
        const dots = [];
        const init = () => {
          dpr = window.devicePixelRatio || 1;
          w = c.clientWidth; h = c.clientHeight;
          c.width = w*dpr; c.height = h*dpr;
          ctx.setTransform(dpr,0,0,dpr,0,0);
          dots.length = 0;
          const cols = Math.ceil(w/26)+2, rows = Math.ceil(h/26)+2;
          for(let y=-1;y<rows;y++) for(let x=-1;x<cols;x++){
            dots.push({ ox: x*26+13, oy: y*26+13, a: Math.random()*Math.PI*2, s: 0.005+Math.random()*0.01, r: 1.25+Math.random()*0.75, z: 0.62+Math.random()*0.44 });
          }
        };
        let cx=w/2, cy=h/2;
        const onMove = (e) => {
          const x = e.touches ? e.touches[0].clientX : e.clientX;
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          cx = x; cy = y;
          mx = (x/w -0.5)*2; my = (y/h -0.5)*2;
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchstart', onMove, { passive: true });
        init();
        window.addEventListener('resize', init);
        const draw = () => {
          ctx.clearRect(0,0,w,h);
          dots.forEach(d => {
            d.a += d.s;
            const driftX = Math.sin(d.a)*1.15;
            const driftY = Math.cos(d.a*0.68)*0.95;
            const parX = mx*8*d.z;
            const parY = my*6*d.z;
            const baseX = d.ox + driftX + parX;
            const baseY = d.oy + driftY + parY;
            const dx = baseX - cx;
            const dy = baseY - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const R = 118;
            let r = d.r * (0.9 + d.z*0.18);
            let addA = 0;
            let px = 0, py = 0;
            if(dist < R){
              const t = 1 - dist/R;
              r = r * (1 + t*1.6);
              addA = t*0.5;
              px = (dx/dist)* t*7;
              py = (dy/dist)* t*7;
            }
            const x = baseX + px;
            const y = baseY + py;
            const isAccent = (Math.floor(d.ox/26)+Math.floor(d.oy/26)) % 9 === 0;
            ctx.beginPath();
            ctx.arc(x,y,r,0,Math.PI*2);
            if(isAccent){
              ctx.fillStyle = `rgba(124,58,237,${0.44 + addA*0.48})`;
              ctx.shadowColor = dist < R ? 'rgba(124,58,237,0.28)' : 'transparent';
              ctx.shadowBlur = dist < R ? 6 : 0;
            } else {
              ctx.fillStyle = `rgba(17,24,39,${0.19 + addA*0.24})`;
              ctx.shadowBlur = 0;
            }
            ctx.fill();
            ctx.shadowBlur = 0;
          });
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);
        return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', onMove); window.removeEventListener('touchmove', onMove); window.removeEventListener('resize', init); };
      }, []);
      return null;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       FEATURE DETAIL MODAL
    ═══════════════════════════════════════════════════════════════════════════ */
    function FeatureModal({ feature, onClose }) {
      useEffect(() => {
        if (!feature) return undefined;
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => {
          document.body.style.overflow = prevOverflow;
          window.removeEventListener('keydown', onKey);
        };
      }, [feature, onClose]);

      if (!feature) return null;

      return ReactDOM.createPortal(
        (
        <motion.div
          className="modal-overlay"
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          exit={{ opacity: 0 }}
          onClick={onClose}
        >
          <motion.div
            className="modal-content"
            initial={{ scale: 0.98, y: 28 }}
            animate={{ scale: 1, y: 0 }}
            exit={{ scale: 0.98, y: 28 }}
            transition={{ type: 'spring', stiffness: 380, damping: 32 }}
            onClick={e => e.stopPropagation()}
          >
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', background: `${feature.color}0F`, borderBottom: '1px solid var(--border)', fontSize: 11, color: feature.color, fontWeight: 600, letterSpacing: '0.06em' }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: feature.color, display: 'inline-block', animation: 'pulseDot 1s ease-in-out infinite' }} /> DETAILED VIEW
              <span style={{ marginLeft: 'auto', fontSize: 10, color: 'var(--text-muted)', fontWeight: 500 }}>Esc or × to close</span>
            </div>
            <AnimatePresence mode="wait">
            <motion.div
              key={feature.id}
              initial={{ opacity: 0, y: 8 }}
              animate={{ opacity: 1, y: 0 }}
              exit={{ opacity: 0, y: -6 }}
              transition={{ duration: 0.2, ease: [0.16,1,0.3,1] }}
            >
            <div style={{ padding: '28px 32px 20px', borderBottom: '1px solid var(--border)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 12 }}>
                <div style={{
                  width: 56,
                  height: 56,
                  borderRadius: 14,
                  background: feature.colorLight,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: 24,
                  color: feature.color
                }}>
                  {feature.icon}
                </div>
                <div style={{ flex: 1 }}>
                  <h2 style={{ fontSize: 24, fontWeight: 700, marginBottom: 2, color: 'var(--text)' }}>{feature.name}</h2>
                  <p style={{ color: feature.color, fontWeight: 600, fontSize: 13 }}>{feature.tagline}</p>
                </div>
                <button
                  onClick={onClose}
                  style={{
                    width: 36,
                    height: 36,
                    borderRadius: 10,
                    border: '1px solid var(--border)',
                    background: 'var(--bg-subtle)',
                    color: 'var(--text-secondary)',
                    fontSize: 18,
                    cursor: 'pointer'
                  }}
                >×</button>
              </div>
              <p style={{ color: 'var(--text-secondary)', fontSize: 15, lineHeight: 1.6 }}>{feature.description}</p>
            </div>

            <div style={{ padding: '24px 32px' }}>
              {feature.modes && (
                <div style={{ marginBottom: 28 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 14, color: feature.color, textTransform: 'uppercase', letterSpacing: '0.05em' }}>

      const [mode, setMode] = useState('chat');
      const [messages, setMessages] = useState([
        { role: 'nova', text: 'Hi! I\'m Nova, your AI learning coach. Ask me anything about your syllabus, or switch to Revision Mode for voice-based cross-questioning.' }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [revisionTopic, setRevisionTopic] = useState('');
      const [revisionStarted, setRevisionStarted] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const messagesEndRef = useRef(null);

      const revisionQuestions = [
        "In your own words, explain what photosynthesis is and why it matters.",
        "Where exactly in the plant cell does photosynthesis occur? Be specific.",
        "What are the two main stages of photosynthesis? Describe each briefly.",
        "Why is water split during the light reactions? What happens to each product?",
        "If I removed all CO₂ from the environment, what would happen to the Calvin cycle?"
      ];

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSend = () => {
        if (!input.trim() || mode === 'revision') return;
        const userMsg = { role: 'user', text: input };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const response = {
            role: 'nova',
            text: "Great question! Photosynthesis is the process by which plants convert light energy into chemical energy stored in glucose. It occurs in the chloroplasts.\n\nNow — can you explain back to me what the two main inputs are? This is how real learning happens."
          };
          setMessages(prev => [...prev, response]);
          setIsTyping(false);
        }, 1500);
      };

      const startRevisionMode = () => {
        if (!revisionTopic.trim()) return;
        setRevisionStarted(true);
        setCurrentQuestion(0);
        setMessages([{
          role: 'nova',
          text: `Starting Revision Mode on "${revisionTopic}".\n\nI'll ask you questions to test your understanding. You'll answer by speaking — no typing allowed in this mode. This is the Feynman technique.\n\nTap the microphone when you're ready, then answer aloud.`,
          isRevisionStart: true
        }]);
      };

      const simulateVoiceAnswer = () => {
        setIsListening(true);
        setTimeout(() => {
          setIsListening(false);
          setMessages(prev => [...prev, { role: 'user', text: '[Voice answer recorded]', isVoice: true }]);

          setTimeout(() => {
            if (currentQuestion < revisionQuestions.length - 1) {
              setCurrentQuestion(prev => prev + 1);
              setMessages(prev => [...prev, {
                role: 'nova',
                text: `Good explanation! Let me probe deeper.\n\n${revisionQuestions[currentQuestion + 1]}`,
                isQuestion: true
              }]);
            } else {
              setMessages(prev => [...prev, {
                role: 'nova',
                text: "Excellent! You've demonstrated solid understanding of this topic. Your weak point seems to be the Calvin cycle details — I'll add that to your Recovery queue.\n\nReady to go back to Chat Mode or practice some questions?",
                isComplete: true
              }]);
            }
          }, 1000);
        }, 3000);
      };

      const switchToChat = () => {
        setMode('chat');
        setRevisionStarted(false);
        setRevisionTopic('');
        setCurrentQuestion(0);
        setMessages([
          { role: 'nova', text: 'Back to Chat Mode! Ask me anything about your syllabus.' }
        ]);
      };

      const switchToRevision = () => {
        setMode('revision');
        setRevisionStarted(false);
        setRevisionTopic('');
        setMessages([]);
      };

      return (
        <div className="chat-container">
          {/* Header */}
          <div className={`chat-header ${mode === 'revision' && revisionStarted ? 'revision-active' : ''}`}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{
                  width: 44,
                  height: 44,
                  borderRadius: 12,
                  background: 'rgba(255,255,255,0.2)',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontWeight: 800,
                  fontSize: 18
                }}>N</div>
                <div>
                  <p style={{ fontWeight: 700, fontSize: 15 }}>Nova — AI Coach</p>
                  <p style={{ fontSize: 12, opacity: 0.8 }}>
                    {mode === 'revision' && revisionStarted ? `Revision Mode · ${revisionTopic}` : 'Unlimited usage · No cap'}
                  </p>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button
                  onClick={switchToChat}
                  style={{
                    padding: '8px 16px',
                    borderRadius: 8,
                    border: 'none',
                    background: mode === 'chat' ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)',
                    color: '#fff',
                    fontSize: 12,
                    fontWeight: 600,
                    cursor: 'pointer'
                  }}
                >Chat</button>
                <button
                  onClick={switchToRevision}
                  className={mode === 'chat' ? 'revision-highlight' : ''}
                  style={{
                    padding: '8px 16px',
                    borderRadius: 8,
                    border: 'none',
                    background: mode === 'revision' ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.95)',
                    color: mode === 'revision' ? '#fff' : '#065f46',
                    fontSize: 12,
                    fontWeight: 800,
                    cursor: 'pointer'
                  }}
                >⟳ Revision</button>
              </div>
            </div>
          </div>
          {/* Highlight bar to drive click to Revision */}
          {mode === 'chat' && (
            <motion.div initial={{ opacity: 0, y: -6 }} animate={{ opacity: 1, y: 0 }} onClick={switchToRevision} style={{ background: 'linear-gradient(90deg, #ecfdf5 0%, #f0fdfa 100%)', borderBottom: '1px solid #a7f3d0', padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
              <span style={{ width: 26, height: 26, borderRadius: 8, background: '#10b981', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, flexShrink: 0 }}>⟳</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 12, fontWeight: 800, color: '#065f46', lineHeight: 1.2 }}>Try Revision mode → voice cross-questioning</p>
                <p style={{ fontSize: 11, color: '#047857' }}>Feynman technique • Nova will quiz you by voice (tap Revision above)</p>
              </div>
              <motion.span animate={{ x: [0,4,0] }} transition={{ duration: 1.2, repeat: Infinity }} style={{ fontSize: 14, color: '#059669', fontWeight: 800 }}>→</motion.span>
            </motion.div>
          )}

          {/* Revision Mode - Topic Selection */}
          {mode === 'revision' && !revisionStarted && (
            <div style={{ padding: 32, textAlign: 'center', background: 'var(--bg-subtle)' }}>
              <div style={{
                width: 64,
                height: 64,
                borderRadius: 16,
                background: 'var(--emerald-light)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: 28,
                margin: '0 auto 20px'
              }}>⟳</div>
              <h3 style={{ fontSize: 20, fontWeight: 700, marginBottom: 8, color: 'var(--text)' }}>Revision Mode</h3>
              <p style={{ color: 'var(--text-secondary)', marginBottom: 24, fontSize: 14, maxWidth: 400, margin: '0 auto 24px' }}>
                Enter the topic you want to revise. Nova will cross-question you using the Feynman technique. You'll answer by speaking — voice only.
              </p>
              <div style={{ maxWidth: 400, margin: '0 auto' }}>
                <input
                  type="text"
                  placeholder="Enter topic (e.g., Photosynthesis, Newton's Laws)"
                  value={revisionTopic}
                  onChange={e => setRevisionTopic(e.target.value)}
                  style={{
                    width: '100%',
                    padding: '14px 18px',
                    borderRadius: 12,
                    border: '1px solid var(--border-strong)',
                    background: 'var(--bg-card)',
                    fontSize: 14,
                    marginBottom: 16,
                    outline: 'none'
                  }}
                />
                <button
                  onClick={startRevisionMode}
                  disabled={!revisionTopic.trim()}
                  style={{
                    width: '100%',
                    padding: '14px 24px',
                    borderRadius: 12,
                    border: 'none',
                    background: revisionTopic.trim() ? 'var(--emerald)' : 'var(--bg-subtle)',
                    color: revisionTopic.trim() ? '#fff' : 'var(--text-muted)',
                    fontSize: 15,
                    fontWeight: 600,
                    cursor: revisionTopic.trim() ? 'pointer' : 'not-allowed'
                  }}
                >Start Voice Revision Session</button>
              </div>
              <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 16 }}>
                No cap limit — use as many times as you want
              </p>
            </div>
          )}

          {/* Chat Messages */}
          {(mode === 'chat' || (mode === 'revision' && revisionStarted)) && (
            <div className="chat-messages">
              {messages.map((msg, i) => (
                <motion.div
                  key={i}
                  initial={{ opacity: 0, y: 8 }}
                  animate={{ opacity: 1, y: 0 }}
                  className={msg.role === 'nova' ? 'msg-nova' : 'msg-user'}
                >
                  {msg.isRevisionStart && (
                    <div style={{
                      background: 'var(--emerald-light)',
                      border: '1px solid rgba(5,150,105,0.2)',
                      borderRadius: 10,
                      padding: 12,
                      marginBottom: 12
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                        <span style={{ fontSize: 14 }}>⟳</span>
                        <span style={{ fontWeight: 700, color: 'var(--emerald)', fontSize: 13 }}>Revision Mode Active</span>
                      </div>
                      <p style={{ fontSize: 11, color: 'var(--text-secondary)' }}>Voice-only cross-questioning. Speak your answers.</p>
                    </div>
                  )}
                  {msg.isQuestion && (
                    <span style={{
                      display: 'inline-block',
                      padding: '3px 8px',
                      background: 'var(--orange-light)',
                      borderRadius: 4,
                      fontSize: 10,
                      fontWeight: 600,
                      color: 'var(--orange)',
                      marginBottom: 8
                    }}>CROSS-QUESTION</span>
                  )}
                  {msg.isVoice && (
                    <span style={{ fontSize: 12, opacity: 0.7 }}>🎤 </span>
                  )}
                  <p style={{ whiteSpace: 'pre-wrap' }}>{msg.text}</p>
                </motion.div>
              ))}

              {/* Voice listening indicator */}
              {mode === 'revision' && revisionStarted && !isListening && messages.length > 0 && !messages[messages.length - 1].isComplete && (
                <div style={{ textAlign: 'center', padding: 20 }}>
                  <div
                    className="voice-indicator"
                    onClick={simulateVoiceAnswer}
                    style={{ cursor: 'pointer' }}
                  >
                    <span style={{ fontSize: 28, color: '#fff' }}>🎤</span>
                  </div>
                  <p style={{ marginTop: 12, fontSize: 13, color: 'var(--text-secondary)' }}>Tap to speak your answer</p>
                </div>
              )}

              {isListening && (
                <div style={{ textAlign: 'center', padding: 20 }}>
                  <div className="voice-indicator" style={{ background: 'var(--rose)' }}>
                    <div className="waveform">
                      {[0, 1, 2, 3, 4].map(i => (
                        <div key={i} className="waveform-bar" style={{ animationDelay: `${i * 0.1}s` }} />
                      ))}
                    </div>
                  </div>
                  <p style={{ marginTop: 12, fontSize: 13, color: 'var(--rose)', fontWeight: 600 }}>Listening...</p>
                </div>
              )}

              {isTyping && mode === 'chat' && (
                <div className="msg-nova" style={{ display: 'flex', gap: 4, padding: 16 }}>
                  {[0, 1, 2].map(i => (
                    <motion.div
                      key={i}
                      animate={{ opacity: [0.3, 1, 0.3] }}
                      transition={{ duration: 1, repeat: Infinity, delay: i * 0.15 }}
                      style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--violet)' }}
                    />
                  ))}
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>
          )}

          {/* Chat Input - Only in Chat Mode */}
          {mode === 'chat' && (
            <div className="chat-input-area">
              <div style={{
                display: 'flex',
                alignItems: 'center',
                gap: 12,
                background: 'var(--bg-subtle)',
                border: '1px solid var(--border)',
                borderRadius: 14,
                padding: '10px 16px'
              }}>
                <button style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 18 }} title="Attach image">📷</button>
                <button style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 18 }} title="Attach file">📎</button>
                <input
                  type="text"
                  placeholder="Ask Nova anything..."
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleSend()}
                  style={{
                    flex: 1,
                    background: 'none',
                    border: 'none',
                    color: 'var(--text)',
                    fontSize: 14,
                    outline: 'none'
                  }}
                />
                <button
                  onClick={handleSend}
                  style={{
                    width: 36,
                    height: 36,
                    borderRadius: 10,
                    border: 'none',
                    background: 'var(--violet)',
                    color: '#fff',
                    cursor: 'pointer',
                    fontSize: 16
                  }}
                >↑</button>
              </div>
            </div>
          )}
        </div>
      );
    }

            borderBottom: scrolled ? '1px solid var(--border)' : 'none',

          <div className="site-nav-inner" style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

              <span style={{ fontWeight: 700, fontSize: 20, color: 'var(--text)', letterSpacing: '-0.02em' }}>Gurukul</span>

              <motion.a

                className="btn btn-primary"
                whileHover={{ scale: 1.05, y: -1 }}
                whileTap={{ scale: 0.96 }}
                transition={{ type: 'spring', stiffness: 450, damping: 20 }}
                style={{ padding: '10px 22px', fontSize: 14 }}
              >Get Started</motion.a>
            </div>
          </div>
        </motion.nav>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       INDIVIDUAL SECTION
    ═══════════════════════════════════════════════════════════════════════════ */
    function IndividualSection() {
      const [selectedFeature, setSelectedFeature] = useState(null);
      const [hoveredId, setHoveredId] = useState(null);
      const hoverTimer = useRef(null);
      const containerRef = useRef(null);
      const isInView = useInView(containerRef, { once: true, margin: "-80px" });

      const isHoverDevice = typeof window !== 'undefined' && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const handleHoverEnter = (feature) => {
        setHoveredId(feature.id);
        if (!isHoverDevice) return;
        if (hoverTimer.current) clearTimeout(hoverTimer.current);
        if (selectedFeature) {
          hoverTimer.current = setTimeout(() => setSelectedFeature(feature), 3000);
        } else {
          hoverTimer.current = setTimeout(() => setSelectedFeature(feature), 3000);
        }
      };
      const handleHoverLeave = () => {
        setHoveredId(null);
        if (hoverTimer.current) clearTimeout(hoverTimer.current);
      };
      useEffect(() => () => { if (hoverTimer.current) clearTimeout(hoverTimer.current); }, []);

      return (
        <section id="individual" className="section section-subtle" ref={containerRef}>
          <div className="section-inner" style={{ maxWidth: 1200, margin: '0 auto', padding: '0 48px', position: 'relative', zIndex: 10 }}>
            <motion.div
              initial={{ opacity: 0, y: 32 }}
              animate={isInView ? { opacity: 1, y: 0 } : {}}
              transition={{ duration: 0.6 }}
              style={{ textAlign: 'center', marginBottom: 40 }}
            >
              <span className="pill pill-violet" style={{ marginBottom: 16 }}>
                For Individual Students
              </span>
              <h2 style={{ fontSize: 'clamp(32px, 4vw, 48px)', fontWeight: 700, marginBottom: 16, color: 'var(--text)' }}>

            </motion.div>

            <AnimatePresence mode="wait">
              <motion.div key={tab} initial={{ opacity: 0, x: 28 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -24 }} transition={{ duration: 0.42, ease: [0.16,1,0.3,1] }} className="pricing-grid" style={{ display: 'grid', gridTemplateColumns: tab === 'organization' ? 'min(420px, 100%)' : 'repeat(3, 1fr)', gap: 20, justifyContent: tab === 'organization' ? 'center' : 'initial' }}>
                {plans.map((plan, i) => (
                <motion.div
                  key={plan.name}
                  className={plan.popular ? 'glow-border' : undefined}
                  whileHover={{ y: -6, scale: 1.02 }}
                  transition={{ type: 'spring', stiffness: 320, damping: 22, delay: i * 0.08 }}
                  style={{
                    background: 'var(--bg-card)',
                    border: plan.popular ? `2px solid ${plan.color}` : '1px solid var(--border)',
                    borderRadius: 20,
                    padding: 28,
                    position: 'relative'
                  }}
                >
                  {plan.popular && (
                    <div style={{
                      position: 'absolute',
                      top: -12,
                      left: '50%',
                      transform: 'translateX(-50%)',
                      background: plan.color,
                      padding: '5px 14px',
                      borderRadius: 20,
                      fontSize: 11,
                      fontWeight: 700,
                      color: '#fff',
                      letterSpacing: '0.03em'
                    }}>POPULAR</div>
                  )}

                  <p className="font-mono" style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.08em', marginBottom: 8 }}>{plan.name.toUpperCase()}</p>
                  {tab === 'organization' ? (
                    <div style={{ marginBottom: 20, height: 44, display: 'flex', alignItems: 'center' }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)', lineHeight: 1.4 }}>Contact Sales — tailored to your schools & students</span>
                    </div>
                  ) : plan.price === 'Custom' ? (
                    <div style={{ marginBottom: 20, height: 44, display: 'flex', alignItems: 'center' }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)', lineHeight: 1.4 }}>Custom pricing — we’ll tailor to your schools & students</span>
                    </div>
                  ) : (
                    <div style={{ marginBottom: 20 }}>
                      <span style={{ fontSize: 40, fontWeight: 800, color: 'var(--text)' }}>{plan.price}</span>
                      <span style={{ fontSize: 14, color: 'var(--text-muted)' }}>{plan.period}</span>
                    </div>
                  )}

                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
                    {plan.features.map(f => (
                      <div key={f} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--text-secondary)' }}>
                        <span style={{ color: plan.color, fontSize: 14 }}>✓</span>
                        {f}
                      </div>
                    ))}
                  </div>

                  <motion.button
                    whileHover={{ scale: 1.01 }}
                    whileTap={{ scale: 0.99 }}
                    onClick={() => { const dest = (tab === 'organization' || plan.price === 'Custom') ? 'mailto:hello@gurukul.study' : '/auth'; (window.top || window).location.href = dest; }}
                    style={{
                      width: '100%',
                      padding: 14,
                      borderRadius: 10,
                      border: plan.popular ? 'none' : '1px solid var(--border)',
                      background: plan.popular ? plan.color : 'var(--bg-subtle)',
                      color: plan.popular ? '#fff' : 'var(--text)',
                      fontWeight: 600,
                      fontSize: 14,
                      cursor: 'pointer'
                    }}
                  >
                    {tab === 'organization' || plan.price === 'Custom' ? 'Contact Sales' : 'Get Started'}
                  </motion.button>
                </motion.div>
                ))}
              </motion.div>
            </AnimatePresence>
          </div>
        </section>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       ROCKET — sudden blast, real flight
    ═══════════════════════════════════════════════════════════════════════════ */
    function RocketChallenge(){
      const [phase, setPhase] = useState('waiting');
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [bookmarked, setBookmarked] = useState(false);
      const [dismissed, setDismissed] = useState(() => {
        try { return localStorage.getItem('gurukul_rocket_shown') === '1'; } catch(e){ return false; }
      });
      const [smokes, setSmokes] = useState([]);
      const question = {
        q: 'What is  3/4  +  1/8  ?',
        correct: '7/8',
        options: [
          { label: 'A', value: '7/8', correct: true, explain: 'Correct — A is 7/8. 3/4 = 6/8, so 6/8 + 1/8 = 7/8.' },
          { label: 'B', value: '5/8', correct: false, explain: 'You chose B (5/8) — that’s 1/8 short. You kept 3/4 as 4/8 instead of 6/8. 3/4 = (3×2)/(4×2) = 6/8, so 6/8 + 1/8 = 7/8, not 5/8. So A (7/8) is correct and B is wrong.' },
          { label: 'C', value: '4/12', correct: false, explain: 'You chose C (4/12) — you added numerators (3+1=4) and denominators (4+8=12). You never add denominators. Need a common denominator: 3/4 = 6/8, so 6/8 + 1/8 = 7/8. 4/12 = 1/3, far from correct. So A (7/8) is correct and C is wrong.' },
          { label: 'D', value: '9/8', correct: false, explain: 'You chose D (9/8) — that’s >1 and too large (1.125). You likely did 3/4 = 8/8 or added incorrectly. Correct is 3/4 = 6/8, so 6/8 + 1/8 = 7/8 = 0.875. So A (7/8) is correct and D is wrong.' }
        ],
        // fallback for safety
        explanation: '3/4 = 6/8, so 6/8 + 1/8 = 7/8.'
      };
      useEffect(() => {
        try { if(localStorage.getItem('gurukul_rocket_shown') === '1') return; } catch(e){}
        const t = setTimeout(() => {
          try { localStorage.setItem('gurukul_rocket_shown', '1'); } catch(e){}
          setPhase('flying');
        }, 5000);
        return () => clearTimeout(t);
      }, []);
      useEffect(() => {
        if(phase === 'flying'){
          const t = setTimeout(() => setPhase('exploding'), 1900);
          return () => clearTimeout(t);
        }
        if(phase === 'exploding'){
          const t = setTimeout(() => setPhase('question'), 1000);
          return () => clearTimeout(t);
        }
      }, [phase]);
      useEffect(() => {
        if(phase !== 'flying') return;
        const id = setInterval(() => {
          setSmokes(s => [...s.slice(-12), { id: Date.now()+Math.random(), x: 50 + (Math.random()-0.5)*2.5 }]);
        }, 70);
        return () => clearInterval(id);
      }, [phase]);
      const handleAnswer = (opt) => {
        if(answered) return;
        setSelected(opt.value);
        setAnswered(true);
        setIsCorrect(!!opt.correct);
      };
      if(dismissed || phase === 'waiting') return null;
      if(phase === 'flying' || phase === 'exploding'){
        return (
          <div className="rocket-overlay" style={{ background: phase==='exploding' ? 'rgba(255,255,255,0.94)' : 'rgba(8,10,24,0.06)', backdropFilter: phase==='flying' ? 'blur(1px)' : 'blur(8px)' }} data-od-id="rocket-stage">
            <div className="rocket-stage">
              {phase==='flying' && <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse 420px 320px at 50% 72%, rgba(255,255,255,0.06), transparent 68%)' }} />}
              {phase==='flying' && [...Array(14)].map((_,i) => (
                <motion.div key={i} initial={{ opacity: 0 }} animate={{ opacity: [0,0.85,0] }} transition={{ duration: 1.1+Math.random()*0.8, repeat: Infinity, delay: i*0.09 }}
                  style={{ position: 'absolute', left: (8+i*6.2)+'%', top: (7+i%3*21)+'%', width: 1.8, height: 1.8, borderRadius: '50%', background: '#fff', boxShadow: '0 0 6px #fff' }} />
              ))}
              {smokes.map(s => (
                <motion.div key={s.id} initial={{ y: 0, opacity: 0.72, scale: 0.6 }} animate={{ y: -26, opacity: 0, scale: 1.7 }} transition={{ duration: 1.15, ease: 'easeOut' }}
                  className="rocket-smoke" style={{ left: s.x + '%', top: '68%' }} />
              ))}
              {phase==='flying' && (
                <motion.div
                  initial={{ y: 80, x: 0, rotate: 0, scale: 0.96 }}
                  animate={{ y: -560, x: [0, -5, 4, -2, 0], rotate: [-1, 0.7, -0.7, 0.5, 0] }}
                  transition={{ y: { duration: 1.85, ease: [0.22,1,0.36,1] }, x: { duration: 1.85, ease: 'easeInOut' }, rotate: { duration: 1.85, ease: 'easeInOut' } }}
                  style={{ position: 'absolute', left: '50%', bottom: 10, marginLeft: -30, width: 60, textAlign: 'center' }}
                >
                  <div className="rocket-svg-wrap">
                    <svg width="60" height="92" viewBox="0 0 60 92" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ display: 'block', margin: '0 auto' }}>
                      <defs>
                        <linearGradient id="rb2" x1="30" y1="12" x2="30" y2="74" gradientUnits="userSpaceOnUse"><stop stopColor="#fff"/><stop offset="0.55" stopColor="#f1f5f9"/><stop offset="1" stopColor="#cbd5e1"/></linearGradient>
                        <linearGradient id="rf2" x1="22" y1="54" x2="38" y2="60" gradientUnits="userSpaceOnUse"><stop stopColor="#7c3aed"/><stop offset="1" stopColor="#ea580c"/></linearGradient>
                      </defs>
                      <path d="M12 62 L4 78 L16 72 Z" fill="#6d28d9" stroke="#4c1d95" strokeWidth="1.2"/>
                      <path d="M48 62 L56 78 L44 72 Z" fill="#6d28d9" stroke="#4c1d95" strokeWidth="1.2"/>
                      <rect x="16" y="18" width="28" height="54" rx="13" fill="url(#rb2)" stroke="#94a3b8" strokeWidth="1.1"/>
                      <path d="M30 4 L16 18 L44 18 Z" fill="#dc2626" stroke="#7f1d1d" strokeWidth="1.1"/>
                      <circle cx="30" cy="38" r="10" fill="#0ea5e9" stroke="#0c4a6e" strokeWidth="1.5"/>
                      <circle cx="30" cy="38" r="6.5" fill="#e0f2fe"/>
                      <circle cx="27.8" cy="35.8" r="1.9" fill="#fff" opacity="0.9"/>
                      <rect x="16" y="53" width="28" height="6" rx="2" fill="url(#rf2)"/>
                      <path d="M20 74 L40 74 L37 82 L23 82 Z" fill="#1f2937" stroke="#020617" strokeWidth="1"/>
                    </svg>
                    <div className="rocket-flame" />
                  </div>
                </motion.div>
              )}
              {phase==='exploding' && (
                <>
                  <motion.div initial={{ scale: 0.2, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} transition={{ duration: 0.26 }} style={{ position: 'absolute', left: '50%', top: '36%', transform: 'translate(-50%,-50%)', textAlign: 'center' }}>
                    <div style={{ fontSize: 88, lineHeight: 1, filter: 'drop-shadow(0 12px 30px rgba(239,68,68,0.4))' }}>💥</div>
                    <div style={{ fontSize: 13, fontWeight: 900, letterSpacing: '0.18em', color: '#991b1b', marginTop: 6, background: '#fff', padding: '5px 12px', borderRadius: 100, border: '1px solid #fecaca' }}>BOOM — CHAOS!</div>
                  </motion.div>
                  {[0,1,2].map(i => (
                    <motion.div key={'s'+i} className="shockwave" initial={{ scale: 0.15, opacity: 0.9 }} animate={{ scale: 5.8, opacity: 0 }} transition={{ duration: 0.85, delay: i*0.11, ease: 'easeOut' }} style={{ borderColor: i===0 ? 'rgba(124,58,237,0.9)' : i===1 ? 'rgba(239,68,68,0.88)' : 'rgba(234,88,12,0.82)' }} />
                  ))}
                  {[...Array(18)].map((_,i) => (
                    <motion.div key={i} className="explosion-dot"
                      initial={{ x: '50vw', y: '36vh', scale: 0, opacity: 1 }}
                      animate={{ x: (50 + Math.cos(i/18*Math.PI*2)*(18 + Math.random()*22))+'vw', y: (36 + Math.sin(i/18*Math.PI*2)*(14 + Math.random()*18))+'vh', scale: [0,1.2,0], opacity: [1,1,0] }}
                      transition={{ duration: 0.88, delay: i*0.016, ease: 'easeOut' }}
                      style={{ width: 9+Math.random()*13, height: 9+Math.random()*13 }}
                    />
                  ))}
                  <motion.div initial={{ opacity: 0 }} animate={{ opacity: [0,0.8,0] }} transition={{ duration: 0.42 }} style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse 680px 440px at 50% 36%, rgba(255,255,255,0.92), transparent 66%)' }} />
                </>
              )}
            </div>
          </div>
        );
      }
      return (
        <div className="rocket-overlay" data-od-id="rocket-question">
          <div className="rocket-chaos-bg" style={{ animation: answered && isCorrect ? 'none' : 'chaosShake 0.55s ease infinite' }} />
          <motion.div
            initial={{ opacity: 0, y: 24, scale: 0.97 }}
            animate={{ opacity: 1, y: 0, scale: 1 }}
            transition={{ duration: 0.38, ease: [0.16,1,0.3,1] }}
            style={{
              position: 'relative', zIndex: 1,
              width: '100%', maxWidth: 520,
              background: '#fff',
              border: '1px solid var(--border)',
              borderRadius: 20,
              boxShadow: '0 24px 60px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.08)',
              overflow: 'hidden',
              animation: answered ? 'none' : 'chaosShake 0.7s ease infinite'
            }}
          >
            <AnimatePresence>
              {answered && !isCorrect && (
                <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} style={{ background: '#fef2f2', borderBottom: '1px solid #fecaca', padding: '13px 18px', overflow: 'hidden' }}>
                  <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                    <span style={{ width: 28, height: 28, borderRadius: 8, background: '#fee2e2', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, flexShrink: 0 }}>🤖</span>
                    <div>
                      <p style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.08em', color: '#dc2626', marginBottom: 3 }}>NOVA AI EXPLAINS — FOR YOUR CHOICE ({selected})</p>
                      <p style={{ fontSize: 13, color: '#7f1d1d', lineHeight: 1.6 }}>{(question.options.find(o=>o.value===selected)?.explain) || question.explanation} <span style={{ fontWeight: 700 }}>Correct is A (7/8).</span></p>
                    </div>
                  </div>
                </motion.div>
              )}
              {answered && isCorrect && (
                <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} style={{ background: '#ecfdf5', borderBottom: '1px solid #a7f3d0', padding: '13px 18px' }}>
                  <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                    <span style={{ width: 28, height: 28, borderRadius: 8, background: '#d1fae5', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>✨</span>
                    <p style={{ fontSize: 13, color: '#065f46', fontWeight: 600 }}>Brilliant — you nailed the common denominator.</p>
                  </div>
                </motion.div>
              )}
            </AnimatePresence>
            <div style={{ padding: '20px 20px 16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                <span className="font-mono" style={{ fontSize: 11, letterSpacing: '0.11em', color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 7, height: 7, borderRadius: '50%', background: '#ef4444', display: 'inline-block', animation: 'pulseDot 0.9s ease infinite' }} /> CHAOS CHALLENGE</span>
                <button onClick={() => setDismissed(true)} style={{ width: 30, height: 30, borderRadius: 8, border: '1px solid var(--border)', background: 'var(--bg-subtle)', color: 'var(--text-muted)', cursor: 'pointer', fontWeight: 700 }}>×</button>
              </div>
              <div style={{ background: 'linear-gradient(180deg, #f9fafb 0%, #fff 100%)', border: '1px solid var(--border)', borderRadius: 14, padding: '18px 18px', textAlign: 'center', marginBottom: 14 }}>
                <p style={{ fontSize: 24, fontWeight: 900, color: 'var(--text)', letterSpacing: '-0.02em' }}>{question.q}</p>
                <p style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 6 }}>Fractions — simple but not too simple</p>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 10, marginBottom: 12 }}>
                {question.options.map(opt => {
                  const isSelected = selected === opt.value;
                  const showCorrect = answered && opt.correct;
                  const showWrong = answered && isSelected && !opt.correct;
                  return (
                    <button
                      key={opt.value}
                      onClick={() => handleAnswer(opt)}
                      disabled={answered}
                      style={{
                        padding: '13px 14px',
                        borderRadius: 12,
                        border: showCorrect ? '2px solid #059669' : showWrong ? '2px solid #dc2626' : isSelected ? '1.5px solid var(--violet)' : '1px solid var(--border)',
                        background: showCorrect ? '#ecfdf5' : showWrong ? '#fef2f2' : isSelected ? 'var(--violet-light)' : '#fff',
                        color: showCorrect ? '#065f46' : showWrong ? '#991b1b' : 'var(--text)',
                        fontWeight: 800, fontSize: 15, cursor: answered ? 'default' : 'pointer',
                        display: 'flex', alignItems: 'center', gap: 10, transition: 'all 0.16s'
                      }}
                    >
                      <span style={{ width: 26, height: 26, borderRadius: 8, background: showCorrect ? '#10b981' : showWrong ? '#ef4444' : 'var(--bg-subtle)', color: showCorrect || showWrong ? '#fff' : 'var(--text-muted)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 900 }}>{opt.label}</span>
                      {opt.value}
                      {showCorrect && <span style={{ marginLeft: 'auto' }}>✓</span>}
                      {showWrong && <span style={{ marginLeft: 'auto' }}>✕</span>}
                    </button>
                  );
                })}
              </div>
              <AnimatePresence>
                {answered && (
                  <motion.div initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} style={{ marginBottom: 12 }}>
                    {isCorrect ? (
                      <div style={{ background: 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)', border: '1.5px solid #f59e0b', borderRadius: 12, padding: '12px 14px', textAlign: 'center' }}>
                        <p style={{ fontSize: 14.5, fontWeight: 900, color: '#92400e' }}>🎉 Congratulations, genius, you have answered it correctly.</p>
                      </div>
                    ) : (
                      <div style={{ background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 10, padding: '10px 14px', textAlign: 'center' }}>
                        <p style={{ fontSize: 13, fontWeight: 800, color: '#92400e' }}>Huh? Check the AI explanation at the top.</p>
                      </div>
                    )}
                  </motion.div>
                )}
              </AnimatePresence>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={() => setBookmarked(b => !b)} style={{ flex: 1, padding: '11px 14px', borderRadius: 10, border: bookmarked ? '1.5px solid #7c3aed' : '1px solid var(--border)', background: bookmarked ? 'var(--violet-light)' : '#fff', color: bookmarked ? 'var(--violet)' : 'var(--text-secondary)', fontWeight: 800, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
                  <span>{bookmarked ? '★' : '☆'}</span> {bookmarked ? 'Saved' : 'Save / Bookmark'}
                </button>
                <button onClick={() => setDismissed(true)} style={{ padding: '11px 18px', borderRadius: 10, border: 'none', background: 'var(--text)', color: '#fff', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>{answered ? 'Continue' : 'Skip'}</button>
              </div>
            </div>
          </motion.div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       FOOTER
    ═══════════════════════════════════════════════════════════════════════════ */
    function Footer() {
      return (
        <footer style={{
          padding: '36px 24px',
          background: 'rgba(255,255,255,0.92)',
          backdropFilter: 'blur(8px)'
        }}>
          <Reveal y={20}>
            <div style={{ maxWidth: 1200, margin: '0 auto', textAlign: 'center' }}>
              <p style={{ fontSize: 12.5, color: 'var(--text-muted)', letterSpacing: '0.02em' }}>
                © 2026 Gurukul. AI-Powered Learning Engine. <span style={{ opacity: 0.6 }}>—</span> Built for learners, loved by tech.
              </p>
            </div>
          </Reveal>
        </footer>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       MAIN APP
    ═══════════════════════════════════════════════════════════════════════════ */
    function App() {
      const [activeSection, setActiveSection] = useState(null);
      const [booting, setBooting] = useState(true);

      useEffect(() => {
        if (activeSection) {
          setTimeout(() => {
            const el = document.getElementById(activeSection);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 100);
        }
      }, [activeSection]);

      return (
        <div style={{ minHeight: '100vh' }}>
          <AnimatePresence>
            {booting && <PageIntro key="intro" onDone={() => setBooting(false)} />}
          </AnimatePresence>
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: booting ? 0.35 : 1 }}
            transition={{ duration: 0.55, ease: [0.16,1,0.3,1] }}
          >
            <ScrollProgress />
            <MouseGlow />
            <BgCanvasFX />
            <Navbar activeSection={activeSection} setActiveSection={setActiveSection} />
            <HeroSection setActiveSection={setActiveSection} />
            <IndividualSection />
            <OrganizationSection />
            <PricingSection />
            <Footer />
            <RocketChallenge />
          </motion.div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
