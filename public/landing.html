    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

      --bg-card: #FFFFFF;
      --text: #1a1a2e;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.12);
      --violet: #7c3aed;
      --violet-light: #ede9fe;
      --orange: #ea580c;
      --orange-light: #fff7ed;
      --emerald: #059669;
      --emerald-light: #ecfdf5;
      --sky: #0284c7;
      --sky-light: #f0f9ff;
      --rose: #e11d48;
      --rose-light: #fff1f2;

    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; }

    /* Subtle gradient background */

      position: fixed;
      inset: 0;
      background:

        radial-gradient(ellipse 80% 60% at 100% 50%, rgba(234,88,12,0.04), transparent 50%),
        radial-gradient(ellipse 60% 60% at 0% 80%, rgba(5,150,105,0.04), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Section backgrounds */
    .section-white { background: var(--bg-card); }
    .section-subtle { background: var(--bg-subtle); }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      border-color: var(--violet);
      box-shadow: 0 8px 30px rgba(124,58,237,0.08), 0 2px 8px rgba(0,0,0,0.04);
      transform: translateY(-2px);
    }

    /* Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .pill-violet { background: var(--violet-light); color: var(--violet); border-color: rgba(124,58,237,0.2); }
    .pill-orange { background: var(--orange-light); color: var(--orange); border-color: rgba(234,88,12,0.2); }
    .pill-emerald { background: var(--emerald-light); color: var(--emerald); border-color: rgba(5,150,105,0.2); }
    .pill-sky { background: var(--sky-light); color: var(--sky); border-color: rgba(2,132,199,0.2); }
    .pill-rose { background: var(--rose-light); color: var(--rose); border-color: rgba(225,29,72,0.2); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--violet);
      color: #fff;
      box-shadow: 0 2px 8px rgba(124,58,237,0.25);
    }
    .btn-primary:hover {
      background: #6d28d9;
      box-shadow: 0 4px 16px rgba(124,58,237,0.35);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: var(--violet);
    }
    .btn-orange {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 2px 8px rgba(234,88,12,0.25);
    }
    .btn-orange:hover {
      background: #c2410c;
      box-shadow: 0 4px 16px rgba(234,88,12,0.35);
      transform: translateY(-1px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background: var(--bg-card);

      max-width: 900px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);

      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);

      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-subtle);

      border-top: 1px solid var(--border);
      padding: 20px 24px;
      background: var(--bg-card);

      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px 16px 16px 4px;
      padding: 16px 20px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .msg-user {
      background: var(--violet);
      color: #fff;
      border-radius: 16px 16px 4px 16px;
      padding: 16px 20px;
      max-width: 85%;
      align-self: flex-end;
      font-size: 14px;
      line-height: 1.7;
    }

    /* Revision mode */
    .revision-active {
      background: linear-gradient(135deg, var(--emerald) 0%, #10b981 100%);
    }
    .voice-indicator {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--emerald);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
    }
    .voice-indicator::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--emerald);
      animation: voice-pulse 1.5s ease-out infinite;
    }
    @keyframes voice-pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* Tab system */
    .tab-btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); background: var(--bg-subtle); }
    .tab-btn.active {
      background: var(--violet-light);
      border-color: rgba(124,58,237,0.2);
      color: var(--violet);

    @keyframes scroll-up { to { transform: translateY(-50%); } }
    @keyframes scroll-down { to { transform: translateY(50%); } }
    .scroll-col-up { animation: scroll-up 40s linear infinite; }
    .scroll-col-down { animation: scroll-down 40s linear infinite; transform: translateY(-50%); }

    /* Section */
    .section { position: relative; padding: 100px 0; overflow: hidden; }

    /* Role panel */
    .role-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .role-panel-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--violet) 0%, var(--orange) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Waveform bars */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 40px;
    }
    .waveform-bar {
      width: 4px;
      background: #fff;
      border-radius: 2px;
      animation: waveform-anim 1s ease-in-out infinite;
    }
    @keyframes waveform-anim {
      0%, 100% { height: 8px; }
      50% { height: 32px; }
    }
  </style>

    /* ═══════════════════════════════════════════════════════════════════════════
       AI COACH DEMO — CHAT + REVISION MODE (VOICE ONLY)
    ═══════════════════════════════════════════════════════════════════════════ */
    function AICoachDemo() {
      const [mode, setMode] = useState('chat');
      const [messages, setMessages] = useState([
        { role: 'nova', text: 'Hi! I\'m Nova, your AI learning coach. Ask me anything about your syllabus, or switch to Revision Mode for voice-based cross-questioning.' }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [revisionTopic, setRevisionTopic] = useState('');
      const [revisionStarted, setRevisionStarted] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const messagesEndRef = useRef(null);

      const revisionQuestions = [
        "In your own words, explain what photosynthesis is and why it matters.",
        "Where exactly in the plant cell does photosynthesis occur? Be specific.",
        "What are the two main stages of photosynthesis? Describe each briefly.",
        "Why is water split during the light reactions? What happens to each product?",
        "If I removed all CO₂ from the environment, what would happen to the Calvin cycle?"
      ];

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSend = () => {
        if (!input.trim() || mode === 'revision') return;
        const userMsg = { role: 'user', text: input };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const response = {
            role: 'nova',
            text: "Great question! Photosynthesis is the process by which plants convert light energy into chemical energy stored in glucose. It occurs in the chloroplasts.\n\nNow — can you explain back to me what the two main inputs are? This is how real learning happens."
          };
          setMessages(prev => [...prev, response]);
          setIsTyping(false);
        }, 1500);
      };

      const startRevisionMode = () => {
        if (!revisionTopic.trim()) return;
        setRevisionStarted(true);
        setCurrentQuestion(0);
        setMessages([{
          role: 'nova',
          text: `Starting Revision Mode on "${revisionTopic}".\n\nI'll ask you questions to test your understanding. You'll answer by speaking — no typing allowed in this mode. This is the Feynman technique.\n\nTap the microphone when you're ready, then answer aloud.`,
          isRevisionStart: true
        }]);
      };

      const simulateVoiceAnswer = () => {
        setIsListening(true);
        setTimeout(() => {
          setIsListening(false);
          setMessages(prev => [...prev, { role: 'user', text: '[Voice answer recorded]', isVoice: true }]);

          setTimeout(() => {
            if (currentQuestion < revisionQuestions.length - 1) {
              setCurrentQuestion(prev => prev + 1);
              setMessages(prev => [...prev, {
                role: 'nova',
                text: `Good explanation! Let me probe deeper.\n\n${revisionQuestions[currentQuestion + 1]}`,
                isQuestion: true
              }]);
            } else {
              setMessages(prev => [...prev, {
                role: 'nova',
                text: "Excellent! You've demonstrated solid understanding of this topic. Your weak point seems to be the Calvin cycle details — I'll add that to your Recovery queue.\n\nReady to go back to Chat Mode or practice some questions?",
                isComplete: true
              }]);
            }
          }, 1000);
        }, 3000);
      };

      const switchToChat = () => {
        setMode('chat');
        setRevisionStarted(false);
        setRevisionTopic('');
        setCurrentQuestion(0);
        setMessages([
          { role: 'nova', text: 'Back to Chat Mode! Ask me anything about your syllabus.' }
        ]);
      };

      const switchToRevision = () => {
        setMode('revision');
        setRevisionStarted(false);
        setRevisionTopic('');
        setMessages([]);
      };

      return (
        <div className="chat-container">
          {/* Header */}
          <div className={`chat-header ${mode === 'revision' && revisionStarted ? 'revision-active' : ''}`}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{
                  width: 44,
                  height: 44,
                  borderRadius: 12,
                  background: 'rgba(255,255,255,0.2)',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontWeight: 800,
                  fontSize: 18
                }}>N</div>
                <div>
                  <p style={{ fontWeight: 700, fontSize: 15 }}>Nova — AI Coach</p>
                  <p style={{ fontSize: 12, opacity: 0.8 }}>
                    {mode === 'revision' && revisionStarted ? `Revision Mode · ${revisionTopic}` : 'Unlimited usage · No cap'}
                  </p>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button
                  onClick={switchToChat}
                  style={{
                    padding: '8px 16px',
                    borderRadius: 8,
                    border: 'none',
                    background: mode === 'chat' ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)',
                    color: '#fff',
                    fontSize: 12,
                    fontWeight: 600,
                    cursor: 'pointer'
                  }}
                >Chat</button>
                <button
                  onClick={switchToRevision}
                  style={{
                    padding: '8px 16px',
                    borderRadius: 8,
                    border: 'none',
                    background: mode === 'revision' ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)',
                    color: '#fff',
                    fontSize: 12,
                    fontWeight: 600,
                    cursor: 'pointer'
                  }}
                >Revision</button>
              </div>
            </div>
          </div>

          {/* Revision Mode - Topic Selection */}
          {mode === 'revision' && !revisionStarted && (
            <div style={{ padding: 32, textAlign: 'center', background: 'var(--bg-subtle)' }}>
              <div style={{
                width: 64,
                height: 64,
                borderRadius: 16,
                background: 'var(--emerald-light)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: 28,
                margin: '0 auto 20px'
              }}>⟳</div>
              <h3 style={{ fontSize: 20, fontWeight: 700, marginBottom: 8, color: 'var(--text)' }}>Revision Mode</h3>
              <p style={{ color: 'var(--text-secondary)', marginBottom: 24, fontSize: 14, maxWidth: 400, margin: '0 auto 24px' }}>
                Enter the topic you want to revise. Nova will cross-question you using the Feynman technique. You'll answer by speaking — voice only.
              </p>
              <div style={{ maxWidth: 400, margin: '0 auto' }}>
                <input
                  type="text"
                  placeholder="Enter topic (e.g., Photosynthesis, Newton's Laws)"
                  value={revisionTopic}
                  onChange={e => setRevisionTopic(e.target.value)}
                  style={{
                    width: '100%',
                    padding: '14px 18px',
                    borderRadius: 12,
                    border: '1px solid var(--border-strong)',
                    background: 'var(--bg-card)',
                    fontSize: 14,
                    marginBottom: 16,
                    outline: 'none'
                  }}
                />
                <button
                  onClick={startRevisionMode}
                  disabled={!revisionTopic.trim()}
                  style={{
                    width: '100%',
                    padding: '14px 24px',
                    borderRadius: 12,
                    border: 'none',
                    background: revisionTopic.trim() ? 'var(--emerald)' : 'var(--bg-subtle)',
                    color: revisionTopic.trim() ? '#fff' : 'var(--text-muted)',
                    fontSize: 15,
                    fontWeight: 600,
                    cursor: revisionTopic.trim() ? 'pointer' : 'not-allowed'
                  }}
                >Start Voice Revision Session</button>
              </div>
              <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 16 }}>
                No cap limit — use as many times as you want
              </p>
            </div>
          )}

          {/* Chat Messages */}
          {(mode === 'chat' || (mode === 'revision' && revisionStarted)) && (
            <div className="chat-messages">
              {messages.map((msg, i) => (
                <motion.div
                  key={i}
                  initial={{ opacity: 0, y: 8 }}
                  animate={{ opacity: 1, y: 0 }}
                  className={msg.role === 'nova' ? 'msg-nova' : 'msg-user'}
                >
                  {msg.isRevisionStart && (
                    <div style={{
                      background: 'var(--emerald-light)',
                      border: '1px solid rgba(5,150,105,0.2)',
                      borderRadius: 10,
                      padding: 12,
                      marginBottom: 12
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                        <span style={{ fontSize: 14 }}>⟳</span>
                        <span style={{ fontWeight: 700, color: 'var(--emerald)', fontSize: 13 }}>Revision Mode Active</span>
                      </div>
                      <p style={{ fontSize: 11, color: 'var(--text-secondary)' }}>Voice-only cross-questioning. Speak your answers.</p>
                    </div>
                  )}
                  {msg.isQuestion && (
                    <span style={{
                      display: 'inline-block',
                      padding: '3px 8px',
                      background: 'var(--orange-light)',
                      borderRadius: 4,
                      fontSize: 10,
                      fontWeight: 600,
                      color: 'var(--orange)',
                      marginBottom: 8
                    }}>CROSS-QUESTION</span>
                  )}
                  {msg.isVoice && (
                    <span style={{ fontSize: 12, opacity: 0.7 }}>🎤 </span>
                  )}
                  <p style={{ whiteSpace: 'pre-wrap' }}>{msg.text}</p>
                </motion.div>
              ))}

              {/* Voice listening indicator */}
              {mode === 'revision' && revisionStarted && !isListening && messages.length > 0 && !messages[messages.length - 1].isComplete && (
                <div style={{ textAlign: 'center', padding: 20 }}>
                  <div
                    className="voice-indicator"
                    onClick={simulateVoiceAnswer}
                    style={{ cursor: 'pointer' }}
                  >
                    <span style={{ fontSize: 28, color: '#fff' }}>🎤</span>
                  </div>
                  <p style={{ marginTop: 12, fontSize: 13, color: 'var(--text-secondary)' }}>Tap to speak your answer</p>
                </div>
              )}

              {isListening && (
                <div style={{ textAlign: 'center', padding: 20 }}>
                  <div className="voice-indicator" style={{ background: 'var(--rose)' }}>
                    <div className="waveform">
                      {[0, 1, 2, 3, 4].map(i => (
                        <div key={i} className="waveform-bar" style={{ animationDelay: `${i * 0.1}s` }} />
                      ))}
                    </div>
                  </div>
                  <p style={{ marginTop: 12, fontSize: 13, color: 'var(--rose)', fontWeight: 600 }}>Listening...</p>
                </div>
              )}

              {isTyping && mode === 'chat' && (
                <div className="msg-nova" style={{ display: 'flex', gap: 4, padding: 16 }}>
                  {[0, 1, 2].map(i => (
                    <motion.div
                      key={i}
                      animate={{ opacity: [0.3, 1, 0.3] }}
                      transition={{ duration: 1, repeat: Infinity, delay: i * 0.15 }}
                      style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--violet)' }}
                    />
                  ))}
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>
          )}

          {/* Chat Input - Only in Chat Mode */}
          {mode === 'chat' && (
            <div className="chat-input-area">
              <div style={{
                display: 'flex',
                alignItems: 'center',
                gap: 12,
                background: 'var(--bg-subtle)',
                border: '1px solid var(--border)',
                borderRadius: 14,
                padding: '10px 16px'
              }}>
                <button style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 18 }} title="Attach image">📷</button>
                <button style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 18 }} title="Attach file">📎</button>
                <input
                  type="text"
                  placeholder="Ask Nova anything..."
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleSend()}
                  style={{
                    flex: 1,
                    background: 'none',
                    border: 'none',
                    color: 'var(--text)',
                    fontSize: 14,
                    outline: 'none'
                  }}
                />
                <button
                  onClick={handleSend}
                  style={{
                    width: 36,
                    height: 36,
                    borderRadius: 10,
                    border: 'none',
                    background: 'var(--violet)',
                    color: '#fff',
                    cursor: 'pointer',
                    fontSize: 16
                  }}
                >↑</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       NAVBAR
    ═══════════════════════════════════════════════════════════════════════════ */
    function Navbar({ activeSection, setActiveSection }) {
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <motion.nav
          initial={{ y: -100 }}
          animate={{ y: 0 }}
          transition={{ duration: 0.5 }}
          style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            zIndex: 100,
            padding: '12px 48px',
            background: scrolled ? 'rgba(250,251,252,0.95)' : 'transparent',
            backdropFilter: scrolled ? 'blur(12px)' : 'none',
            borderBottom: scrolled ? '1px solid var(--border)' : 'none',
            transition: 'all 0.2s'
          }}
        >
          <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <motion.div
              style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}
              whileHover={{ scale: 1.01 }}
              onClick={() => { setActiveSection(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            >
              <div style={{
                width: 40,
                height: 40,
                borderRadius: 12,
                background: 'linear-gradient(135deg, var(--violet) 0%, var(--orange) 100%)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontWeight: 800,
                fontSize: 18,
                color: '#fff'
              }}>G</div>

                color: '#fff'
              }}>G</div>
              <span style={{ fontWeight: 700, fontSize: 17, color: 'var(--text)' }}>Gurukul</span>
            </div>
            <p style={{ fontSize: 13, color: 'var(--text-muted)' }}>
              © 2026 Gurukul. AI-Powered Learning Engine.
            </p>
          </div>
        </footer>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       MAIN APP
    ═══════════════════════════════════════════════════════════════════════════ */
    function App() {
      const [activeSection, setActiveSection] = useState(null);

      useEffect(() => {
        if (activeSection) {
          setTimeout(() => {
            const el = document.getElementById(activeSection);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 100);
        }
      }, [activeSection]);

      return (
        <div style={{ minHeight: '100vh' }}>
          <Navbar activeSection={activeSection} setActiveSection={setActiveSection} />
          <HeroSection setActiveSection={setActiveSection} />
          <IndividualSection />
          <OrganizationSection />
          <PricingSection />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
