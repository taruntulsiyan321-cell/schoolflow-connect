# Called by the database, not by a person: `dispatch_notification_push`
# (20260925190000) posts to it through pg_net once a minute when notifications
# are waiting for a phone, and the database has no user to sign a JWT for. So
# the gateway does not check one, and the function checks something narrower
# instead: every call without the drain secret (`x-push-drain`, the vault
# secret `notification_push_drain` = the NOTIFICATION_PUSH_DRAIN function
# secret) is refused 401 before anything is read.
[functions.notification-push]
verify_jwt = false

# The same shape, the same reason: `dispatch_variant_generation` and
# `dispatch_question_embedding` post to these through pg_net with no JWT, only
# the drain secret (`x-variant-drain` = the VARIANT_GENERATION_DRAIN function
# secret), and each function refuses a call without it (403) before reading
# anything. Production has run both with verify_jwt = false; until 2026-09-27
# this file did not say so, and a deploy from it would have turned the
# gateway's JWT check back on and refused every call the database makes.
[functions.ai-recovery-variants]
verify_jwt = false

[functions.question-embedding-drain]
verify_jwt = false

# Functions with no entry here inherit Supabase's default verify_jwt = true,
# which is the correct (JWT-required) setting for all of them:
#   admin-link-account, custom-practice-upload, screen-capture-mistake,
#   verify-msg91-widget.
#
# NO FUNCTION ANSWERS AN UNAUTHENTICATED CALLER. The three above that skip the
# gateway's JWT check refuse anything without their secret. `send-otp` and
# `verify-otp` were `verify_jwt = false` -- reachable by anyone who knew the
# URL -- and nothing called them: the wired OTP path is `verify-msg91-widget`
# (src/lib/msg91Auth.ts:32). Both were DELETED from the project on 2026-09-07
# (KNOWN_ISSUES 8b) and their source left the repo on 2026-09-27 with the
# other dead functions (KNOWN_ISSUES 75); a declaration for a function that
# does not exist is how the ai-improvement-plan entry below came to be stale.
#
