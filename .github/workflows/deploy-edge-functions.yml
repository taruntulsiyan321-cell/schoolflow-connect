# Deploy Supabase Edge Functions (AI + DPP) on push to main.
# Add GitHub repo secret: SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens)
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: kdmjipeksjdyojjdokbi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Gemini client into function folders
        run: npm run functions:sync

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy AI edge functions
        run: |
          supabase functions deploy ai-explain ai-battle-report ai-improvement-plan ai-concept-report dpp-generate-questions --project-ref $PROJECT_ID --use-api
