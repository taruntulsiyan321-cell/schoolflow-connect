name: Quality gates
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run quality:scan
      - run: npm run quality:student-context
      - run: npm run quality:flow
      - run: npm run quality:guardrails
      # Blocking gate from day one (2026-08-23). Unlike lint:tenant-scope
      # below, this one was driven to zero findings in the same pass that
      # introduced it: every hit was either fixed by routing the value through
      # @/lib/presentation, or given an ALLOWLIST entry with a specific,
      # checkable reason. It stays meaningful only while that stays true --
      # a new finding means a raw internal value can reach the screen again.
      - run: npm run lint:render-safety
      # tsc is a hard gate: the baseline was cleaned to zero errors on
      # 2026-08-21 specifically so this could be turned on for real.
      - run: npx tsc --noEmit -p tsconfig.app.json
      # Full suite, not the old hand-picked 8/35 files.
      - run: npm run test
      # Credential-free half of the two-homes check (added 2026-08-30).
      #
      # The recovery constants live in a TypeScript module AND in the
      # recovery_constants table, because a database function cannot import a
      # module and §10 forbids literals in either. There is no third option, so
      # what the design needs is a check: if RECOVERY_TRIGGER_COUNT is 5 in the
      # table and 8 in the module nothing errors, recovery fires at one
      # threshold, the UI describes another, and the first person to notice is a
      # confused student.
      #
      # Comparing the two homes needs SUPABASE_ACCESS_TOKEN, which this repo's
      # Actions secrets do not have (same blocker as the two commented-out gates
      # below). --offline runs the half that does not: parse completeness,
      # declared-key presence, the derivation check, array arity. That is not a
      # consolation prize -- the one hole this gate actually shipped with
      # (RECOVERY_SESSION_SIZE written as a literal instead of the sum of the
      # four tiers) is in the offline half. It never prints that the two homes
      # agree, because it did not look.
      - run: npm run check:recovery-constants:offline
      # The gate's own negative control. It shipped green and blind to 2 of 8
      # drift shapes; only running the control found that. Without this line the
      # gate above can rot back into passing on input it should reject, and
      # nothing would say so.
      - run: npm run check:recovery-constants:negative
      # Static, credential-free: flags any function touching a school-scoped
      # table with zero school_id reference -- the exact pattern that caused
      # the match_question_bank / match_ai_answer_cache cross-school leak.
      # NOT a blocking gate yet: on its first run (2026-08-21) it flagged 114
      # functions, and one genuinely was a real bug (recovery_assignments.school_id,
      # fixed same day) -- but most of the 114 are exact-single-row-ID lookups
      # (e.g. "does this teacher teach this exact class") where tenant scoping
      # doesn't apply, which the current regex heuristic can't yet tell apart
      # from a real gap. Continue-on-error until each of the 114 is triaged
      # into either a real fix or an ALLOWLIST entry with a specific reason --
      # rubber-stamping them all into the allowlist today just to turn this
      # into a passing gate would defeat the entire point of the check.
      - run: npm run lint:tenant-scope
        continue-on-error: true
      #
      # NOT yet enabled as gates, both need a live SUPABASE_ACCESS_TOKEN this
      # repo's GitHub Actions secrets don't have (gh secret list is empty --
      # see docs/PRODUCTION_DEPLOYMENT_ARCHITECTURE.md). Add the secret, then
      # add these two lines back:
      #   - run: node scripts/check-pending-migrations.mjs
      #   - run: npm run db:verify-integrity
      #
      # `npm run lint` is intentionally NOT a gate yet: it currently reports
      # 274 pre-existing errors (almost entirely @typescript-eslint/no-explicit-any)
      # across files this pass never touched. That's real type-safety debt,
      # but fixing 274 annotations correctly needs its own deliberate pass --
      # rubber-stamping them under time pressure to make a CI gate green
      # would trade real type safety for a passing checkmark. Tracked, not
      # silently dropped: fix it for real, then turn this on.
      # - run: npm run lint
